<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: white; }
        #container { width: 100%; height: 100%; overflow: auto; }
        .docx-wrapper { background: white !important; padding: 0px !important; }
        .docx-wrapper > section.docx { 
            box-shadow: none !important; 
            margin: 0 !important; 
            padding: 24px 32px !important; 
            width: auto !important; 
            min-height: auto !important;
        }
    </style>
</head>
<body>
    <div id="container"></div>
    <script src="jszip.min.js"></script>
    <script src="docx-preview.min.js"></script>
    <script>
        function b64toBlob(b64Data, contentType='', sliceSize=512) {
            const byteCharacters = atob(b64Data);
            const byteArrays = [];
            for (let offset = 0; offset < byteCharacters.length; offset += sliceSize) {
                const slice = byteCharacters.slice(offset, offset + sliceSize);
                const byteNumbers = new Array(slice.length);
                for (let i = 0; i < slice.length; i++) {
                    byteNumbers[i] = slice.charCodeAt(i);
                }
                const byteArray = new Uint8Array(byteNumbers);
                byteArrays.push(byteArray);
            }
            return new Blob(byteArrays, {type: contentType});
        }

        function renderDocx(base64Data) {
            var blob = b64toBlob(base64Data, "application/vnd.openxmlformats-officedocument.wordprocessingml.document");
            var container = document.getElementById("container");
            docx.renderAsync(blob, container)
                .then(function(x) {
                    console.log("docx: finished");
                })
                .catch(function(e) {
                    container.innerHTML = "<p style='color:red; padding: 16px;'>Error rendering document: " + e + "</p>";
                });
        }

        window.onload = function() {
            if (window.Android) {
                var data = window.Android.getBase64Data();
                if (data) {
                    renderDocx(data);
                }
            }
        };
    </script>
</body>
</html>
